# Descriptor error against mask resolution
# Ref: Sec. 6.5 and Sec. 4.1; the propagated-error column of Table 5
defaults:
  model: foundation_trunk
  data: fixture_full
  train: main
name: supplementary_resolution_study
hydraulics:
  reference_mode: max
  upsample_factor: 2
evaluation:
  bootstrap_resamples: 2000
  threshold: 0.5
  seeds: [20260101, 20260102, 20260103, 20260104, 20260105]
  resolution_ladder: [2.0, 1.0, 0.5, 0.25]
