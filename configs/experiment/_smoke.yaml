# for unit-test smoke only; do not use for reporting
# Ref: the smoke configuration a unit test runs two steps on
defaults:
  model: foundation_trunk
  data: fixture_small
  train: main
name: _smoke
# The smoke run shrinks the declared widths so two optimiser steps stay cheap; the
# reported profile is the one configs/experiment/main.yaml resolves.
model:
  width_mult: 0.05
  decoder_width_mult: 1.0
  reported_total_millions: null
hydraulics:
  reference_mode: max
  upsample_factor: 2
evaluation:
  bootstrap_resamples: 2000
  threshold: 0.5
  seeds: [20260101, 20260102, 20260103, 20260104, 20260105]
train:
  epochs: 2
  batch_size: 2
  grad_accumulation: 1
  num_workers: 0
  warmup_epochs: 0.0
  precision: fp32
  ema_decay: 0.0
  augment: false
