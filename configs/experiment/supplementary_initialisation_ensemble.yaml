# Five independently initialised runs, probability averaged
# Ref: Sec. 3.5; Supplementary Table S1
defaults:
  model: foundation_trunk
  data: fixture_full
  train: main
name: supplementary_initialisation_ensemble
hydraulics:
  reference_mode: max
  upsample_factor: 2
evaluation:
  bootstrap_resamples: 2000
  threshold: 0.5
  seeds: [20260101, 20260102, 20260103, 20260104, 20260105]
  ensemble_size: 5
  ensemble_rule: probability
