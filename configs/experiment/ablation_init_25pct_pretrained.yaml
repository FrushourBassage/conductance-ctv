# Ablation: 25 percent of the corpus initialised from pretrained weights
# Ref: Table 2 row 12
defaults:
  model: foundation_trunk
  data: fixture_full
  train: main
name: ablation_init_25pct_pretrained
hydraulics:
  reference_mode: max
  upsample_factor: 2
evaluation:
  bootstrap_resamples: 2000
  threshold: 0.5
  seeds: [20260101, 20260102, 20260103, 20260104, 20260105]
  corpus_fraction: 0.25
  initialisation: pretrained
