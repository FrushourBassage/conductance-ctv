# Ablation: 10 percent of the corpus initialised from scratch
# Ref: Table 2 row 10
defaults:
  model: foundation_trunk
  data: fixture_full
  train: main
name: ablation_init_10pct_scratch
hydraulics:
  reference_mode: max
  upsample_factor: 2
evaluation:
  bootstrap_resamples: 2000
  threshold: 0.5
  seeds: [20260101, 20260102, 20260103, 20260104, 20260105]
  corpus_fraction: 0.10
  initialisation: scratch
