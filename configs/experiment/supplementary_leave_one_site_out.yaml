# Leave-one-site-out evaluation over the three sites
# Ref: Sec. 3.3; Supplementary Table S15
defaults:
  model: foundation_trunk
  data: fixture_full
  train: main
name: supplementary_leave_one_site_out
hydraulics:
  reference_mode: max
  upsample_factor: 2
evaluation:
  bootstrap_resamples: 2000
  threshold: 0.5
  seeds: [20260101, 20260102, 20260103, 20260104, 20260105]
  evaluation_split: leave_one_site_out
