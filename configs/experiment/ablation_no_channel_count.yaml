# Ablation: the channel count removed from the descriptor vector
# Ref: Table 2 row 3
defaults:
  model: foundation_trunk
  data: fixture_full
  train: main
name: ablation_no_channel_count
hydraulics:
  reference_mode: max
  upsample_factor: 2
evaluation:
  bootstrap_resamples: 2000
  threshold: 0.5
  seeds: [20260101, 20260102, 20260103, 20260104, 20260105]
  descriptor_fields: [minimum_luminal_area, minimum_conductance_arclength, shape_factor, series_resistance, resistance_ratio, conductance_weighted_length]
