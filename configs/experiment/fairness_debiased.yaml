# Constrained variant with a group-fairness penalty and equalised call rates
# Ref: Table 3 fairness-debiased row; Supplementary Table S18
defaults:
  model: foundation_trunk
  data: fixture_full
  train: fairness_constrained
name: fairness_debiased
hydraulics:
  reference_mode: max
  upsample_factor: 2
evaluation:
  bootstrap_resamples: 2000
  threshold: 0.5
  seeds: [20260101, 20260102, 20260103, 20260104, 20260105]
  fairness_constraint: true
