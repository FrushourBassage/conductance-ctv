# Encoder family and its width multiplier. Table 1 reports the parameter total of
# each family without its per-layer widths, so the width is the free variable and
# the reported total is the constraint. The multiplier below is the resolved
# bracket: resolve_width_bracket returns the nearer of the two achievable totals
# around the reported one, and the measured count is always reported beside it.
encoder: universal_transferred
family: vit
width_mult: 2.1328
decoder_width_mult: 1.0
reported_params_millions: 96.4
lumen_classes: 2
deep_supervision: false
freeze_encoder: false
